# Standalone posture-only configuration. Add this source to your existing
# config instead if you also collect logs. Enable the collectors separately.
endpoint: https://keen.example.org/api/v1/otlp/logs
enrollment:
  code_file: /etc/keen-agent/enrollment-code
state_dir: /var/lib/keen-agent
queue_mb: 256
poll_seconds: 15
initial_lookback: 24h
sources:
  - name: workstation-posture
    kind: journal
    parser: posture
    # No units: the parser selects and authenticates the two collector units.
